<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Horizon Level Camera</title>

<!-- ---------- PWA / Home Screen install support ---------- -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<!-- iOS "Add to Home Screen" support (Safari ignores manifest.json for these) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Horizon">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<!-- Android / Chrome install icon -->
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<style>
  /* ---------- BASE RESET ---------- */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#000; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    touch-action:none;
  }

  /* Hidden <video> element — used purely as a WebGL texture source, never shown directly */
  #srcVideo { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }

  /* The visible output — a FIXED landscape (16:9) frame, letterboxed on
     portrait screens exactly like the real Horizon app's portrait view */
  #glCanvas {
    position:fixed; top:50%; left:50%;
    display:block; background:#000;
    transform-origin:center center;
  }

  /* ---------- PERMISSION / START OVERLAY ---------- */
  #startOverlay {
    position:fixed; inset:0; z-index:50;
    background:rgba(0,0,0,0.92);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; padding:24px;
  }
  #startOverlay h1 { font-size:22px; font-weight:600; margin-bottom:10px; }
  #startOverlay p { font-size:14px; opacity:0.7; margin-bottom:28px; max-width:320px; line-height:1.4; }
  #startBtn {
    background:#ffcc00; color:#000; border:none; border-radius:50px;
    padding:16px 42px; font-size:16px; font-weight:700; letter-spacing:0.5px;
    box-shadow:0 4px 20px rgba(255,204,0,0.4);
  }
  #startBtn:active { transform:scale(0.96); }
  #errorMsg { color:#ff5c5c; font-size:13px; margin-top:18px; max-width:300px; }
  #installHint {
    color:#888; font-size:12px; margin-top:22px; max-width:280px; line-height:1.4;
    border-top:1px solid rgba(255,255,255,0.1); padding-top:16px; display:none;
  }
  #installHint.show { display:block; }

  /* ---------- ON-SCREEN HUD ---------- */
  #hud {
    position:fixed; inset:0; z-index:10; pointer-events:none;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  #tiltReadout {
    align-self:center; margin-top:env(safe-area-inset-top, 20px);
    background:rgba(0,0,0,0.4); color:#ffcc00;
    font-variant-numeric:tabular-nums; font-size:14px; font-weight:600;
    padding:6px 16px; border-radius:20px; letter-spacing:1px;
  }
  #bottomBar {
    display:flex; align-items:center; justify-content:center;
    padding-bottom:calc(env(safe-area-inset-bottom, 20px) + 20px);
    pointer-events:auto; gap:24px;
  }
  #recordBtn {
    width:76px; height:76px; border-radius:50%;
    border:4px solid rgba(255,255,255,0.85);
    background:transparent; position:relative;
  }
  #recordBtn::after {
    content:''; position:absolute; inset:6px; border-radius:50%;
    background:#ff3b30; transition:border-radius 0.2s, inset 0.2s;
  }
  #recordBtn.recording::after { border-radius:6px; inset:20px; }
  #recordBtn.recording { border-color:#ff3b30; }
  #zoomModeBtn {
    width:72px; padding:8px 0; border-radius:16px;
    background:rgba(0,0,0,0.45); color:#ffcc00;
    border:1px solid rgba(255,204,0,0.5);
    font-size:11px; font-weight:700; letter-spacing:1px;
    display: none; /* Hidden since we are hardcoding the zoom logic */
  }
  #zoomModeBtn.auto { color:#7fd4ff; border-color:rgba(127,212,255,0.5); }
  #bottomSpacer { width:72px; } 
  #recStatus {
    position:absolute; top:calc(env(safe-area-inset-top, 20px) + 44px);
    left:50%; transform:translateX(-50%);
    color:#ff5c5c; font-size:13px; font-weight:600; display:none; align-items:center; gap:6px;
  }
  #recStatus.show { display:flex; }
  #recDot { width:8px; height:8px; border-radius:50%; background:#ff3b30; animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.2;} }
</style>
</head>
<body>

  <video id="srcVideo" playsinline muted autoplay></video>
  <canvas id="glCanvas"></canvas>

  <div id="hud">
    <div id="tiltReadout">STABLE</div>
    <div id="recStatus"><span id="recDot"></span>REC <span id="recTime">00:00</span></div>
    <div id="bottomBar">
      <button id="zoomModeBtn" aria-label="Zoom mode">LOCKED</button>
      <button id="recordBtn" aria-label="Record"></button>
      <div id="bottomSpacer"></div>
    </div>
  </div>

  <div id="startOverlay">
    <h1>Awkward Office Camera</h1>
    <p>Disables horizon lock and randomly snap-zooms into the subject when recording.</p>
    <button id="startBtn">Start Camera</button>
    <div id="errorMsg"></div>
    <div id="installHint">Tip: use your browser's "Add to Home Screen" to install this like an app.</div>
  </div>

<script>
(function () {
  'use strict';

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch((err) => {
        console.warn('Service worker registration failed:', err);
      });
    });
  }

  const isStandalone = window.matchMedia('(display-mode: standalone)').matches
                     || window.navigator.standalone === true;
  if (!isStandalone) {
    document.getElementById('installHint').classList.add('show');
  }

  const video   = document.getElementById('srcVideo');
  const canvas  = document.getElementById('glCanvas');
  const overlay = document.getElementById('startOverlay');
  const startBtn = document.getElementById('startBtn');
  const errorMsg = document.getElementById('errorMsg');
  const recordBtn = document.getElementById('recordBtn');
  const recStatus = document.getElementById('recStatus');
  const recTimeEl = document.getElementById('recTime');
  const tiltReadout = document.getElementById('tiltReadout');

  const DEG2RAD = Math.PI / 180;

  let gravX = 0;
  let gravY = 0;
  let gravInit = false; 

  const GRAVITY_SMOOTHING = 0.1;

  let fusedRoll = 0;          
  let fusedInit = false;
  let lastMotionT = 0;        

  const ACCEL_CORRECTION = 0.02;

  let gyroSign = 0;           
  let gyroScore = 0;
  let prevARoll = null;
  const GYRO_SCORE_NEEDED = 8;

  let zoomLocked = true;
  let lockedZoomAspect = 0;   
  let lockedZoomValue = 1;
  let prevSrcAspect = 0;      

  let gravitySign = 1;
  let signCalibrated = false;
  const ROLL_SIGN = 1;

  let motionListenerAttached = false;
  let smoothedRoll = 0;
  let smoothedScale = 1;

  let combinedStream = null;   
  let audioTrack = null;
  let mediaRecorder = null;
  let recordedChunks = [];
  let isRecording = false;
  let recStartTime = 0;
  let recTimerHandle = null;

  // The Office Awkward Zoom State
  let officeZoomTarget = 1.0;
  let currentOfficeZoom = 1.0;
  let nextZoomTime = 0;

  const gl = canvas.getContext('webgl', { antialias: false, preserveDrawingBuffer: false })
          || canvas.getContext('experimental-webgl');

  if (!gl) {
    fatalError('WebGL is not available on this device/browser.');
    return;
  }

  const VERTEX_SRC = `
    attribute vec2 aPosition;
    attribute vec2 aTexCoord;
    varying vec2 vTexCoord;
    void main() {
      vTexCoord = aTexCoord;
      gl_Position = vec4(aPosition, 0.0, 1.0);
    }
  `;

  const FRAGMENT_SRC = `
    precision mediump float;
    varying vec2 vTexCoord;

    uniform sampler2D uTexture;
    uniform float uRotation;
    uniform float uScale;
    uniform float uOutAspect;
    uniform float uSrcAspect;

    void main() {
      vec2 p = (vTexCoord - 0.5) * vec2(uOutAspect, 1.0);
      p /= uScale;

      float s = sin(-uRotation);
      float c = cos(-uRotation);
      mat2 rot = mat2(c, -s, s, c);
      vec2 q = rot * p;

      vec2 uv = q / vec2(uSrcAspect, 1.0) + 0.5;

      if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) {
        gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
      } else {
        gl_FragColor = texture2D(uTexture, uv);
      }
    }
  `;

  function compileShader(type, src) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, src);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const info = gl.getShaderInfoLog(shader);
      gl.deleteShader(shader);
      throw new Error('Shader compile error: ' + info);
    }
    return shader;
  }

  const program = gl.createProgram();
  gl.attachShader(program, compileShader(gl.VERTEX_SHADER, VERTEX_SRC));
  gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, FRAGMENT_SRC));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    fatalError('WebGL program link error: ' + gl.getProgramInfoLog(program));
    return;
  }
  gl.useProgram(program);

  const positions = new Float32Array([ -1,-1,  1,-1,  -1,1,  1,1 ]);
  const texCoords  = new Float32Array([  0,1,   1,1,    0,0,  1,0 ]);

  const posBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
  const aPosition = gl.getAttribLocation(program, 'aPosition');
  gl.enableVertexAttribArray(aPosition);
  gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, 0, 0);

  const texBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, texBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, texCoords, gl.STATIC_DRAW);
  const aTexCoord = gl.getAttribLocation(program, 'aTexCoord');
  gl.enableVertexAttribArray(aTexCoord);
  gl.vertexAttribPointer(aTexCoord, 2, gl.FLOAT, false, 0, 0);

  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

  const uRotationLoc  = gl.getUniformLocation(program, 'uRotation');
  const uScaleLoc     = gl.getUniformLocation(program, 'uScale');
  const uOutAspectLoc = gl.getUniformLocation(program, 'uOutAspect');
  const uSrcAspectLoc = gl.getUniformLocation(program, 'uSrcAspect');

  const OUT_WIDTH  = 1920;
  const OUT_HEIGHT = 1080;
  const OUT_ASPECT = OUT_WIDTH / OUT_HEIGHT;
  canvas.width  = OUT_WIDTH;
  canvas.height = OUT_HEIGHT;
  gl.viewport(0, 0, OUT_WIDTH, OUT_HEIGHT);
  gl.uniform1f(uOutAspectLoc, OUT_ASPECT);

  function getScreenAngleDeg() {
    if (screen.orientation && typeof screen.orientation.angle === 'number') {
      return screen.orientation.angle;
    }
    if (typeof window.orientation === 'number') {
      return (360 - window.orientation) % 360;
    }
    return 0;
  }

  function computeTargetRoll() {
    // Returning 0 COMPLETELY DISABLES the gimbal/horizon effect.
    // The recording will stay fixed to the camera's raw feed.
    return 0;
  }

  function lerpAngle(a, b, t) {
    let diff = b - a;
    while (diff > Math.PI)  diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    return a + diff * t;
  }

  function handleMotion(evt) {
    const g = evt.accelerationIncludingGravity;
    if (!g || g.x === null || g.y === null) return;

    const now = performance.now();
    const dt = lastMotionT ? Math.min((now - lastMotionT) / 1000, 0.1) : 0;
    lastMotionT = now;

    const gx = g.x * gravitySign;
    const gy = g.y * gravitySign;

    if (!gravInit) {
      gravX = gx;
      gravY = gy;
      gravInit = true;
      return;
    }

    gravX += (gx - gravX) * GRAVITY_SMOOTHING;
    gravY += (gy - gravY) * GRAVITY_SMOOTHING;

    const aRoll = Math.atan2(gravX, gravY) * ROLL_SIGN;

    if (!fusedInit) {
      fusedRoll = aRoll;
      fusedInit = true;
      prevARoll = aRoll;
      return;
    }

    const rr = evt.rotationRate;
    const rate = (rr && rr.alpha !== null && rr.alpha !== undefined) ? rr.alpha : null;

    if (gyroSign === 0 && rate !== null && dt > 0 && prevARoll !== null) {
      let dA = aRoll - prevARoll;
      while (dA > Math.PI)  dA -= 2 * Math.PI;
      while (dA < -Math.PI) dA += 2 * Math.PI;
      const aVel = dA / dt; 
      if (Math.abs(rate) > 30 && Math.abs(aVel) > 0.25) {
        gyroScore += Math.sign(rate) * Math.sign(aVel);
        if (Math.abs(gyroScore) >= GYRO_SCORE_NEEDED) {
          gyroSign = gyroScore > 0 ? 1 : -1;
        }
      }
    }
    prevARoll = aRoll;

    if (gyroSign !== 0 && rate !== null && dt > 0) {
      fusedRoll += gyroSign * ROLL_SIGN * rate * DEG2RAD * dt;
      fusedRoll = lerpAngle(fusedRoll, aRoll, ACCEL_CORRECTION);
    } else {
      fusedRoll = lerpAngle(fusedRoll, aRoll, 0.35);
    }
  }

  async function requestMotionPermission() {
    if (typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function') {
      const result = await DeviceMotionEvent.requestPermission();
      if (result !== 'granted') {
        throw new Error('Motion sensor permission was denied.');
      }
    }
    if (!motionListenerAttached) {
      window.addEventListener('devicemotion', handleMotion, true);
      motionListenerAttached = true;
    }
  }

  async function requestCameraAndMic() {
    combinedStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width:  { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: true
    });
    video.srcObject = combinedStream;
    audioTrack = combinedStream.getAudioTracks()[0] || null;
    await video.play();
  }

  function fatalError(msg) {
    errorMsg.textContent = msg;
    console.error(msg);
  }

  startBtn.addEventListener('click', async function () {
    startBtn.disabled = true;
    errorMsg.textContent = '';
    try {
      await requestMotionPermission();
      await requestCameraAndMic();
      overlay.style.display = 'none';
      requestAnimationFrame(renderLoop);
    } catch (err) {
      fatalError(err.message || 'Could not start camera.');
      startBtn.disabled = false;
    }
  });

  function calibrateGravitySign() {
    if (signCalibrated || !gravInit) return;
    if (Math.hypot(gravX, gravY) < 4.0) return;
    const roll = fusedInit ? fusedRoll : Math.atan2(gravX, gravY) * ROLL_SIGN;
    const compensated = roll;
    if (Math.cos(compensated) < 0) {
      gravitySign = -1;
      gravX = -gravX;
      gravY = -gravY;
      fusedRoll = Math.atan2(gravX, gravY) * ROLL_SIGN;
      prevARoll = fusedRoll;
      gyroScore = 0;
      gyroSign = 0;
    }
    signCalibrated = true;
  }

  function renderLoop() {
    if (video.readyState >= video.HAVE_CURRENT_DATA && video.videoWidth > 0) {
      calibrateGravitySign();

      gl.bindTexture(gl.TEXTURE_2D, texture);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);

      // Force target to 0 so no stabilization occurs
      const target = computeTargetRoll();
      smoothedRoll = lerpAngle(smoothedRoll, target, 0.5);

      const srcAspect = video.videoWidth / video.videoHeight;
      let targetScale;
      
      // Base calculation for covering the aspect ratio
      if (zoomLocked) {
        if (Math.abs(lockedZoomAspect - srcAspect) > 1e-3) {
          let m = 0;
          for (let d = 0; d <= 90; d++) {
            const r2 = d * DEG2RAD;
            const c2 = Math.abs(Math.cos(r2));
            const s2 = Math.abs(Math.sin(r2));
            m = Math.max(m, Math.max((OUT_ASPECT * c2 + s2) / srcAspect, OUT_ASPECT * s2 + c2));
          }
          lockedZoomValue = m * 1.002;
          lockedZoomAspect = srcAspect;
        }
        targetScale = lockedZoomValue;
      } else {
        const ac = Math.abs(Math.cos(smoothedRoll));
        const as = Math.abs(Math.sin(smoothedRoll));
        targetScale = Math.max(
          (OUT_ASPECT * ac + as) / srcAspect,
          (OUT_ASPECT * as + ac)
        ) * 1.002;
      }

      if (prevSrcAspect > 0 && Math.abs(srcAspect - prevSrcAspect) > 0.2) {
        smoothedRoll = computeTargetRoll();
        smoothedScale = targetScale;
      }
      prevSrcAspect = srcAspect;

      smoothedScale += (targetScale - smoothedScale) * 0.25;

      // =====================================================================
      // THE OFFICE ZOOM LOGIC
      // Randomly creates rapid, poorly-eased snap zooms while recording
      // =====================================================================
      if (isRecording) {
        const now = performance.now();
        if (now > nextZoomTime) {
          if (officeZoomTarget === 1.0) {
            // Snap zoom in (between 1.6x and 2.3x)
            officeZoomTarget = 1.6 + (Math.random() * 0.7);
            // Hold the awkward close-up for 1.5 to 3.5 seconds
            nextZoomTime = now + 1500 + (Math.random() * 2000);
          } else {
            // Snap back out
            officeZoomTarget = 1.0;
            // Hold the wide shot for 2 to 5 seconds
            nextZoomTime = now + 2000 + (Math.random() * 3000);
          }
        }
      } else {
        officeZoomTarget = 1.0;
        nextZoomTime = 0;
      }

      // Fast lerp value (0.45) creates a harsh manual camera-operator feel
      currentOfficeZoom += (officeZoomTarget - currentOfficeZoom) * 0.45;

      gl.uniform1f(uRotationLoc, smoothedRoll);
      
      // Multiplying the scale variable rapidly pushes UV coordinates inwards, effectively zooming
      gl.uniform1f(uScaleLoc, smoothedScale * currentOfficeZoom);
      gl.uniform1f(uSrcAspectLoc, srcAspect);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      updatePreview();
    }

    requestAnimationFrame(renderLoop);
  }

  let previewQuadrant = 0;      
  let previewCssRotation = 0;   
  const PREVIEW_HYSTERESIS = 18; 

  function previewFit() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const wUp = Math.min(vw, vh * OUT_ASPECT);
    const hUp = wUp / OUT_ASPECT;
    const sideways = Math.max(vw / hUp, vh / wUp);
    return { wUp: wUp, hUp: hUp, sideways: sideways };
  }

  function applyPreview(rotDeg, scale, animate) {
    const f = previewFit();
    canvas.style.width  = f.wUp + 'px';
    canvas.style.height = f.hUp + 'px';
    const end = 'translate(-50%,-50%) rotate(' + rotDeg + 'deg) scale(' + scale + ')';
    if (animate) {
      const midScale = Math.max(scale, canvas._lastScale || 1) * 1.25;
      const midRot = ((canvas._lastRot || 0) + rotDeg) / 2;
      canvas.animate(
        [
          { transform: 'translate(-50%,-50%) rotate(' + (canvas._lastRot || 0) + 'deg) scale(' + (canvas._lastScale || 1) + ')' },
          { transform: 'translate(-50%,-50%) rotate(' + midRot + 'deg) scale(' + midScale + ')', offset: 0.5 },
          { transform: end }
        ],
        { duration: 420, easing: 'ease-in-out', fill: 'none' }
      );
    }
    canvas.style.transform = end;
    canvas._lastRot = rotDeg;
    canvas._lastScale = scale;
  }

  function updatePreview() {
    if (!fusedInit) { applyPreview(0, 1, false); return; }

    const physical = fusedRoll * 180 / Math.PI;
    const rel = ((physical - previewQuadrant) % 360 + 540) % 360 - 180;

    if (Math.abs(rel) > 45 + PREVIEW_HYSTERESIS) {
      const q = ((Math.round(physical / 90) * 90) % 360 + 360) % 360;
      const targetCss = q;
      let delta = ((targetCss - previewCssRotation) % 360 + 540) % 360 - 180;
      previewCssRotation += delta;
      previewQuadrant = q;
      const sideways = (q === 90 || q === 270);
      const f = previewFit();
      applyPreview(previewCssRotation, sideways ? f.sideways : 1, true);
    }
  }

  window.addEventListener('resize', function () {
    const sideways = (previewQuadrant === 90 || previewQuadrant === 270);
    const f = previewFit();
    applyPreview(previewCssRotation, sideways ? f.sideways : 1, false);
  });
  applyPreview(0, 1, false);

  function pickSupportedMimeType() {
    const candidates = [
      'video/mp4;codecs=avc1,mp4a.40.2', 
      'video/mp4',
      'video/webm;codecs=vp9,opus',      
      'video/webm;codecs=vp8,opus',
      'video/webm'
    ];
    for (const type of candidates) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(type)) {
        return type;
      }
    }
    return ''; 
  }

  function startRecording() {
    if (!canvas.captureStream) {
      fatalError('This browser does not support canvas.captureStream().');
      return;
    }

    const canvasStream = canvas.captureStream(30);
    if (audioTrack) {
      canvasStream.addTrack(audioTrack);
    }

    const mimeType = pickSupportedMimeType();
    recordedChunks = [];

    try {
      mediaRecorder = mimeType
        ? new MediaRecorder(canvasStream, { mimeType, videoBitsPerSecond: 8_000_000 })
        : new MediaRecorder(canvasStream);
    } catch (err) {
      fatalError('Could not start recorder: ' + err.message);
      return;
    }

    mediaRecorder.ondataavailable = function (e) {
      if (e.data && e.data.size > 0) recordedChunks.push(e.data);
    };
    mediaRecorder.onstop = handleRecordingStop;

    mediaRecorder.start(1000); 
    isRecording = true;
    
    // Kickoff the initial zoom timing directly on record start
    nextZoomTime = performance.now() + 800 + Math.random() * 1500;

    recStartTime = Date.now();
    recordBtn.classList.add('recording');
    recStatus.classList.add('show');
    recTimerHandle = setInterval(updateRecTimer, 250);
  }

  function updateRecTimer() {
    const elapsed = Math.floor((Date.now() - recStartTime) / 1000);
    const mm = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const ss = String(elapsed % 60).padStart(2, '0');
    recTimeEl.textContent = mm + ':' + ss;
  }

  function stopRecording() {
    if (mediaRecorder && isRecording) {
      mediaRecorder.stop();
    }
    isRecording = false;
    recordBtn.classList.remove('recording');
    recStatus.classList.remove('show');
    clearInterval(recTimerHandle);
  }

  async function handleRecordingStop() {
    const mimeType = mediaRecorder.mimeType || 'video/webm';
    const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(recordedChunks, { type: mimeType });
    const filename = 'awkward-zoom-video-' + Date.now() + '.' + ext;
    const file = new File([blob], filename, { type: mimeType });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({
          files: [file],
          title: 'Awkward Office Video',
          text: 'Recorded video with awkward zooms'
        });
        return;
      } catch (err) {
        console.warn('Share cancelled/failed, falling back to download:', err);
      }
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  recordBtn.addEventListener('click', function () {
    if (isRecording) {
      stopRecording();
    } else {
      startRecording();
    }
  });

})();
</script>
</body>
</html>
